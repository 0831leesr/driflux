name: Daily maintenance — discover, Steam, evaluations, top streamers
run-name: Daily maintenance (${{ github.event_name }})

on:
  schedule:
    - cron: "0 19 * * *" # 매일 UTC 19:00 (한국시간 새벽 4시)
  workflow_dispatch:

jobs:
  daily-tasks:
    runs-on: ubuntu-latest
    env:
      BASE: ${{ secrets.VERCEL_PROJECT_PRODUCTION_URL }}
      SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Run daily crons
        run: |
          set -euo pipefail
          BASE="$(printf '%s' "$BASE" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [[ ! "$BASE" =~ ^https?:// ]]; then
            BASE="https://${BASE}"
          fi
          BASE="${BASE%/}"
          cron_get() {
            local path="$1"
            local resp
            resp=$(curl -sfSL --location-trusted --max-redirs 8 -X GET "${BASE}${path}" \
              -H "Authorization: Bearer ${SECRET}" \
              -H "Accept: application/json")
            echo "$resp"
            echo "$resp" | jq -e 'type == "object"' >/dev/null
          }
          cron_get "/api/cron/discover-top-games"
          cron_get "/api/cron/update-steam?limit=20"
          cron_get "/api/cron/update-evaluations?steamLimit=100&criticLimit=30"
          cron_get "/api/cron/update-top-streamers"
