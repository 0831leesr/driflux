name: Daily maintenance — discover, Steam, evaluations, top streamers
run-name: Daily maintenance (${{ github.event_name }})

on:
  schedule:
    - cron: "0 19 * * *" # 매일 UTC 19:00 (한국시간 새벽 4시)
  workflow_dispatch:

jobs:
  daily-tasks:
    runs-on: ubuntu-latest
    steps:
      - run: 'curl -sf -X GET "${{ secrets.VERCEL_PROJECT_PRODUCTION_URL }}/api/cron/discover-top-games" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"'

      - run: 'curl -sf -X GET "${{ secrets.VERCEL_PROJECT_PRODUCTION_URL }}/api/cron/update-steam?limit=20" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"'

      - run: 'curl -sf -X GET "${{ secrets.VERCEL_PROJECT_PRODUCTION_URL }}/api/cron/update-evaluations?steamLimit=100&criticLimit=30" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"'

      # TOP 스트리머: game_id가 많으면 한 요청에서 타임아웃 → 4분할 순차 호출
      - run: 'curl -sf -X GET "${{ secrets.VERCEL_PROJECT_PRODUCTION_URL }}/api/cron/update-top-streamers?part=0&parts=4" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"'
      - run: 'curl -sf -X GET "${{ secrets.VERCEL_PROJECT_PRODUCTION_URL }}/api/cron/update-top-streamers?part=1&parts=4" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"'
      - run: 'curl -sf -X GET "${{ secrets.VERCEL_PROJECT_PRODUCTION_URL }}/api/cron/update-top-streamers?part=2&parts=4" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"'
      - run: 'curl -sf -X GET "${{ secrets.VERCEL_PROJECT_PRODUCTION_URL }}/api/cron/update-top-streamers?part=3&parts=4" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"'
