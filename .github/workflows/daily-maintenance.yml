name: Daily maintenance — discover, Steam, evaluations, top streamers

on:
  schedule:
    - cron: "0 19 * * *" # 매일 UTC 19:00 (한국시간 새벽 4시)
  workflow_dispatch:

jobs:
  daily-tasks:
    runs-on: ubuntu-latest
    steps:
      - run: curl -sf -X GET "${{ secrets.VERCEL_PROJECT_PRODUCTION_URL }}/api/cron/discover-top-games" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - run: curl -sf -X GET "${{ secrets.VERCEL_PROJECT_PRODUCTION_URL }}/api/cron/update-steam?limit=50" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - run: curl -sf -X GET "${{ secrets.VERCEL_PROJECT_PRODUCTION_URL }}/api/cron/update-evaluations?steamLimit=100&criticLimit=30" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - run: curl -sf -X GET "${{ secrets.VERCEL_PROJECT_PRODUCTION_URL }}/api/cron/update-top-streamers" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
