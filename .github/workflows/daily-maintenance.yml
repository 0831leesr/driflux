name: Daily maintenance — discover, Steam, evaluations

on:
  schedule:
    - cron: "0 19 * * *" # 매일 UTC 19:00 (한국시간 새벽 4시)
  workflow_dispatch:

jobs:
  daily-maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Discover top games
        run: |
          curl -sf -X GET "${{ secrets.VERCEL_PROJECT_PRODUCTION_URL }}/api/cron/discover-top-games" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Update Steam metadata
        run: |
          curl -sf -X GET "${{ secrets.VERCEL_PROJECT_PRODUCTION_URL }}/api/cron/update-steam?limit=50" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Update evaluations (Steam + critic)
        run: |
          HTTP=$(curl -s -o /tmp/evals_resp.txt -w "%{http_code}" -X GET "${{ secrets.VERCEL_PROJECT_PRODUCTION_URL }}/api/cron/update-evaluations?steamLimit=100&criticLimit=30" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP $HTTP"
          cat /tmp/evals_resp.txt
          if [ "$HTTP" -ge 400 ]; then exit 1; fi
