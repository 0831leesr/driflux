name: Daily maintenance — discover, Steam, evaluations, top streamers
run-name: Daily maintenance (${{ github.event_name }})

on:
  schedule:
    - cron: "0 19 * * *" # 매일 UTC 19:00 (한국시간 새벽 4시)
  workflow_dispatch:

jobs:
  daily-tasks:
    runs-on: ubuntu-latest
    env:
      BASE: ${{ secrets.VERCEL_PROJECT_PRODUCTION_URL }}
      SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Run daily crons
        run: |
          set -euo pipefail
          if [[ ! "$BASE" =~ ^https?:// ]]; then
            BASE="https://${BASE}"
          fi
          curl -sfS -X GET "${BASE}/api/cron/discover-top-games" \
            -H "Authorization: Bearer ${SECRET}"
          curl -sfS -X GET "${BASE}/api/cron/update-steam?limit=20" \
            -H "Authorization: Bearer ${SECRET}"
          curl -sfS -X GET "${BASE}/api/cron/update-evaluations?steamLimit=100&criticLimit=30" \
            -H "Authorization: Bearer ${SECRET}"
          curl -sfS -X GET "${BASE}/api/cron/update-top-streamers" \
            -H "Authorization: Bearer ${SECRET}"
