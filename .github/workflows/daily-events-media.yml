name: Daily Events & Media

on:
  schedule:
    - cron: '0 1 * * *'  # 매일 UTC 01:00 (한국 시간 10:00)
  workflow_dispatch:      # 수동 실행 가능

jobs:
  update-esports-events:
    runs-on: ubuntu-latest
    env:
      BASE: ${{ secrets.VERCEL_PROJECT_PRODUCTION_URL }}
      SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Update Esports Events
        run: |
          set -euo pipefail
          BASE="$(printf '%s' "$BASE" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [[ ! "$BASE" =~ ^https?:// ]]; then BASE="https://${BASE}"; fi
          BASE="${BASE%/}"
          resp=$(curl -sfSL --location-trusted --max-redirs 8 -X GET \
            "${BASE}/api/cron/update-esports-events" \
            -H "Authorization: Bearer ${SECRET}" \
            -H "Accept: application/json")
          echo "$resp"
          echo "$resp" | jq -e 'type == "object"' >/dev/null

  update-new-releases:
    runs-on: ubuntu-latest
    needs: []  # 독립 실행
    env:
      BASE: ${{ secrets.VERCEL_PROJECT_PRODUCTION_URL }}
      SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Update New Releases (IGDB Anticipated)
        run: |
          set -euo pipefail
          BASE="$(printf '%s' "$BASE" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [[ ! "$BASE" =~ ^https?:// ]]; then BASE="https://${BASE}"; fi
          BASE="${BASE%/}"
          resp=$(curl -sfSL --location-trusted --max-redirs 8 -X GET \
            "${BASE}/api/cron/update-new-releases" \
            -H "Authorization: Bearer ${SECRET}" \
            -H "Accept: application/json")
          echo "$resp"
          echo "$resp" | jq -e 'type == "object"' >/dev/null

  update-videos:
    runs-on: ubuntu-latest
    needs: []  # 독립 실행
    env:
      BASE: ${{ secrets.VERCEL_PROJECT_PRODUCTION_URL }}
      SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Update Chzzk VOD Cache
        run: |
          set -euo pipefail
          BASE="$(printf '%s' "$BASE" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [[ ! "$BASE" =~ ^https?:// ]]; then BASE="https://${BASE}"; fi
          BASE="${BASE%/}"
          resp=$(curl -sfSL --location-trusted --max-redirs 8 -X GET \
            "${BASE}/api/cron/update-videos?limit=30" \
            -H "Authorization: Bearer ${SECRET}" \
            -H "Accept: application/json")
          echo "$resp"
          echo "$resp" | jq -e 'type == "object"' >/dev/null
