name: Frequent stats — update-daily-stats

on:
  schedule:
    - cron: "*/30 * * * *" # 30분마다
  workflow_dispatch:

jobs:
  update-daily-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger update-daily-stats
        env:
          BASE: ${{ secrets.VERCEL_PROJECT_PRODUCTION_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          BASE="$(printf '%s' "$BASE" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [[ ! "$BASE" =~ ^https?:// ]]; then
            BASE="https://${BASE}"
          fi
          BASE="${BASE%/}"
          # -L: 리다이렉트(apex↔www, 미들웨어 등)를 따라가야 실제 API JSON을 받음
          # --location-trusted: 리다이렉트 후에도 Authorization: Bearer 전달(Vercel/도메인 홉)
          resp=$(curl -sfSL --location-trusted --max-redirs 8 -X GET \
            "${BASE}/api/cron/update-daily-stats" \
            -H "Authorization: Bearer ${SECRET}" \
            -H "Accept: application/json")
          echo "$resp"
          echo "$resp" | jq -e 'type == "object"' >/dev/null
