name: Frequent stats — update-daily-stats

on:
  schedule:
    - cron: "*/30 * * * *" # 30분마다
  workflow_dispatch:

jobs:
  update-daily-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger update-daily-stats
        env:
          BASE: ${{ secrets.VERCEL_PROJECT_PRODUCTION_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE" =~ ^https?:// ]]; then
            BASE="https://${BASE}"
          fi
          curl -sfS -X GET "${BASE}/api/cron/update-daily-stats" \
            -H "Authorization: Bearer ${SECRET}"
